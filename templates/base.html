<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07061a">
  <title>{% block title %}Deezer → Navidrome{% endblock %}</title>
  <link rel="preload" href="{{ url_for('static', filename='fonts/unbounded-latin-wght-normal.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ url_for('static', filename='fonts/instrument-sans-latin-wght-normal.woff2') }}" as="font" type="font/woff2" crossorigin>
  {% for sheet in ['tokens', 'layers', 'cells', 'components', 'drawer'] %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/' ~ sheet ~ '.css') }}">
  {% endfor %}
  {% block styles %}{% endblock %}
</head>
<body>
  <canvas id="bg-noise" aria-hidden="true"></canvas>
  <div class="blur-field" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <div class="app">
    <header class="cell topbar">
      <a class="brand" href="{{ url_for('playlists.home') }}">
        <span class="brand-name">Deezer <span>→</span> Navidrome</span>
        <span class="brand-version" id="version-tag"></span>
      </a>
      <div class="topbar-right">
        <a id="new-version-tag" class="update-badge hidden" href="#" target="_blank" rel="noopener">Update available</a>
        <nav class="nav" aria-label="Main">
          <a href="{{ url_for('playlists.home') }}" {% if request.endpoint == 'playlists.home' %}aria-current="page"{% endif %}>Dashboard</a>
          <a href="{{ url_for('system.config_view') }}" {% if request.endpoint == 'system.config_view' %}aria-current="page"{% endif %}>Settings</a>
        </nav>
      </div>
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>
  </div>

  {% block overlays %}{% endblock %}

  <script type="application/json" id="flash-messages">{{ get_flashed_messages() | tojson }}</script>
  {% block scripts %}{% endblock %}
</body>
</html>

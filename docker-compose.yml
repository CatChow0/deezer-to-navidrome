services:
  deezer-to-navidrome:
    image: catchow/deezer-to-navidrome:latest
    container_name: deezer-to-navidrome
    restart: unless-stopped

    # Allow the container to use all available CPU cores.
    # Without this, Docker may throttle the process and prevent
    # the library scanner from running its per-HDD thread pools
    # at full speed.
    cpus: "4.0"          # set to your actual core count
    cpu_shares: 1024     # default share weight (relative priority)

    # Behind a reverse proxy on a shared Docker network, drop ports: (see the
    # README, "Behind a reverse proxy"); on the same machine without a shared
    # network, "127.0.0.1:8080:8080" keeps it reachable through the proxy only.
    ports:
      - "8080:8080"

    # Every setting is in .env: copy .env.example to .env and fill it in.
    env_file: .env

    volumes:
      # Persistent data (config, cache, covers)
      - ./data:/data

      # Music library directories. deezer-dl must be writable: downloads go there.
      - /path/on/host/deezer-dl:/music/deezer-dl
      - /path/on/host/library:/music/library

      # Playlist output directory
      - /path/on/host/playlists:/music/playlists

      # Optional: listening history to import into the Stats tab (read-only)
      # - /path/to/navidrome/data:/import/navidrome:ro
      # - /path/to/Maloja:/import/maloja:ro